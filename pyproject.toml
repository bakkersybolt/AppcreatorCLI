[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appcreator"
version = "0.1.0"
description = "CLI tool voor het genereren van AI-ready boilerplate applicaties."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
# Dit koppelt het commando 'appcreator' in de terminal aan de functie 'app' in main.py
appcreator = "appcreator.main:app"
